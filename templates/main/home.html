{% extends "base.html" %}
{% block content %}
<!-- Hero Section - Mobile Optimized -->
<section class="relative h-screen min-h-[560px] flex items-center justify-center overflow-hidden">
    <div class="absolute inset-0">
        <img src="{{ url_for('static', filename='assets/students_on_home_2.png') }}"
             alt="School campus"
             class="w-full h-full object-cover">
        <div class="absolute inset-0 bg-gradient-to-b from-black/70 via-black/60 to-black/75"></div>
    </div>
   
    <div class="relative z-10 text-center text-white px-5 max-w-4xl mx-auto">
        <h1 class="text-4xl sm:text-5xl md:text-6xl lg:text-7xl font-bold tracking-tighter mb-4 heading-font hero-title">
            God's Peculiar Treasure School
        </h1>
        <p class="text-xl sm:text-2xl md:text-3xl font-light mb-6 text-amber-100">
            Excellent Spirit
        </p>
        <p class="text-base sm:text-lg md:text-xl max-w-2xl mx-auto mb-10 opacity-95 px-2">
            A Christ-centered learning community dedicated to nurturing every child's God-given potential
        </p>
       
        <div class="flex flex-col sm:flex-row gap-4 justify-center px-4">
            <a href="{{ url_for('student.search') }}"
               class="inline-block w-full sm:w-auto px-8 py-5 bg-amber-600 hover:bg-amber-700 text-white font-semibold text-lg rounded-2xl transition transform hover:scale-105 shadow-xl">
                Check Result →
            </a>
            <a href="{{ url_for('main.books') }}"
               class="inline-block w-full sm:w-auto px-8 py-5 bg-white/10 backdrop-blur-md border border-white/40 hover:bg-white/20 text-white font-semibold text-lg rounded-2xl transition">
                📚 Books by Class
            </a>
            <a href="#about"
               class="inline-block w-full sm:w-auto px-8 py-5 bg-white/10 backdrop-blur-md border border-white/40 hover:bg-white/20 text-white font-semibold text-lg rounded-2xl transition">
                Discover More
            </a>
        </div>
    </div>
    <div class="absolute bottom-8 left-1/2 -translate-x-1/2 animate-bounce hidden sm:block">
        <i class="fas fa-chevron-down text-4xl text-white/70"></i>
    </div>
</section>

<!-- Rest of your sections remain unchanged -->
<!-- About Section, Why Choose Us, etc. -->

{% endblock %}
