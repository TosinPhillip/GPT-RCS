{% extends "base.html" %}
{% block content %}
<div class="min-h-screen bg-gradient-to-br from-indigo-900 via-purple-900 to-pink-900 flex items-center justify-center px-6">
    <div class="max-w-4xl text-center text-white">
        <h1 class="text-5xl md:text-7xl font-bold mb-8 animate-fade-in">
            God's Peculiar Treasure School
        </h1>
        <p class="text-xl md:text-3xl mb-12 opacity-90">
            Results Portal
        </p>
        <div class="space-y-6 md:space-y-0 md:space-x-8 md:flex md:justify-center">
            <a href="{{ url_for('student.search') }}"
               class="inline-block px-10 py-6 bg-white text-indigo-800 text-xl font-bold rounded-2xl hover:bg-gray-100 transform hover:scale-105 transition shadow-2xl">
                🧑‍🎓 Student Login
            </a>
            <a href="{{ url_for('teacher.login') }}"
               class="inline-block px-10 py-6 bg-yellow-400 text-gray-900 text-xl font-bold rounded-2xl hover:bg-yellow-300 transform hover:scale-105 transition shadow-2xl">
                👩‍🏫 Teacher Login
            </a>
            <a href="{{ url_for('admin.login') }}"
               class="inline-block px-10 py-6 bg-red-600 text-white text-xl font-bold rounded-2xl hover:bg-red-500 transform hover:scale-105 transition shadow-2xl">
                ⚙️ Admin Login
            </a>
        </div>
        <p class="mt-16 text-lg opacity-80">
            Access your academic records securely — current students and alumni welcome ❤️
        </p>
    </div>
</div>
{% endblock %}
