{% extends 'base.html' %}
{% block content %}

<div class="max-w-6xl mx-auto px-4 sm:px-6 py-8">

    <div class="bg-white rounded-3xl shadow-xl overflow-hidden">

        <!-- Header -->
        <div class="bg-gradient-to-br from-amber-600 to-yellow-600 text-white p-8 sm:p-12">
            <h1 class="text-3xl sm:text-4xl font-bold heading-font tracking-tight">
                {{ class_ }} — {{ session }}
            </h1>
            <p class="text-amber-100 mt-2">Class Teacher Comments &amp; Ratings</p>
        </div>

        <div class="p-6 sm:p-10">

            <!-- Term Selector -->
            <div class="mb-10">
                <label class="block text-sm font-medium text-gray-700 mb-3">Select Term</label>
                <select id="term" 
                        class="w-full sm:w-80 p-4 border border-gray-200 rounded-2xl focus:outline-none focus:border-amber-500 focus:ring-4 focus:ring-amber-100 transition text-base">
                    <option value="">-- Select Term --</option>
                    {% for t in terms %}
                    <option value="{{ t.name }}">{{ t.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <!-- Students Table -->
            <div id="table-container" class="hidden">
                <h2 class="text-2xl font-bold text-gray-800 mb-6 heading-font">Student Records</h2>
                
                <div class="overflow-x-auto rounded-3xl border border-gray-100">
                    <table class="min-w-full">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-6 py-5 text-left font-medium text-gray-700">Adm #</th>
                                <th class="px-6 py-5 text-left font-medium text-gray-700">Student Name</th>
                                <th class="px-6 py-5 text-left font-medium text-gray-700">Class Teacher Comment</th>
                                <th class="px-6 py-5 text-center font-medium text-gray-700">Attendance (%)</th>
                                <th class="px-6 py-5 text-left font-medium text-gray-700">Psychomotor</th>
                            </tr>
                        </thead>
                        <tbody id="students-tbody" class="divide-y divide-gray-100">
                            <!-- Populated from existing Jinja loop -->
                            {% for s in students %}
                            <tr class="hover:bg-amber-50 transition">
                                <td class="px-6 py-5 font-medium">{{ s.admission_number }}</td>
                                <td class="px-6 py-5">{{ s.name }}</td>
                                <td class="px-6 py-5">
                                    <textarea data-adm="{{ s.admission_number }}" 
                                              class="w-full min-h-[80px] p-4 border border-gray-200 rounded-2xl focus:border-amber-500 resize-y focus:ring-amber-100"></textarea>
                                </td>
                                <td class="px-6 py-5 text-center">
                                    <input type="number" min="0" max="100" 
                                           data-adm="{{ s.admission_number }}"
                                           class="w-28 p-4 border border-gray-200 rounded-2xl text-center focus:border-amber-500">
                                </td>
                                <td class="px-6 py-5">
                                    <textarea data-adm="{{ s.admission_number }}" 
                                              class="w-full min-h-[80px] p-4 border border-gray-200 rounded-2xl focus:border-amber-500 resize-y"></textarea>
                                </td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>

                <div class="mt-10 text-center">
                    <button id="submit" 
                            class="w-full sm:w-auto px-16 py-5 bg-amber-600 hover:bg-amber-700 text-white font-semibold text-lg rounded-2xl shadow-lg transition">
                        💾 Save All Comments &amp; Ratings
                    </button>
                </div>
            </div>

            <div id="result" class="mt-8 text-center"></div>
        </div>
    </div>
</div>

<script>
document.getElementById('term').addEventListener('change', () => {
    const tableContainer = document.getElementById('table-container');
    tableContainer.classList.remove('hidden');
});

document.getElementById('submit').addEventListener('click', async () => {
    const updates = [];
    document.querySelectorAll('#students-tbody tr').forEach(row => {
        const adm = row.querySelector('textarea').dataset.adm;
        const comment = row.querySelector('textarea:nth-of-type(1)').value;
        const attendance = row.querySelector('input').value;
        const psychomotor = row.querySelector('textarea:nth-of-type(2)').value;

        updates.push({
            adm_no: adm,
            comment: comment,
            attendance: attendance,
            psychomotor: psychomotor
        });
    });

    const res = await fetch('/teacher/class_teacher/update', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
            session: "{{ session }}",
            class: "{{ class_ }}",
            term: document.getElementById('term').value,
            updates
        })
    });

    const data = await res.json();
    const resultDiv = document.getElementById('result');
    
    if (data.status === 'success') {
        resultDiv.innerHTML = `<p class="text-green-600 font-medium py-4">✅ Saved successfully!</p>`;
    } else {
        resultDiv.innerHTML = `<p class="text-red-600 font-medium py-4">${data.error || 'Failed to save'}</p>`;
    }
});
</script>

{% endblock %}
