{% extends 'base.html' %}
{% block content %}

<div class="max-w-6xl mx-auto px-4 sm:px-6 py-8">
    <div class="bg-white rounded-3xl shadow-xl overflow-hidden">
        
        <!-- Page Header -->
        <div class="bg-gradient-to-br from-amber-600 to-yellow-600 text-white p-8 sm:p-10 text-center">
            <h2 class="text-3xl sm:text-4xl font-bold heading-font tracking-tight">Upload Results</h2>
            <p class="text-amber-100 mt-2">Fill the form below to upload student scores</p>
        </div>

        <div class="p-6 sm:p-10">
            <!-- Filters -->
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-10">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Session</label>
                    <select id="session" class="w-full p-4 border border-gray-200 rounded-2xl focus:outline-none focus:border-amber-500 transition text-base">
                        <option value="">-- Select Session --</option>
                        {% for s in sessions %}<option value="{{ s.name }}">{{ s.name }}</option>{% endfor %}
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Term</label>
                    <select id="term" class="w-full p-4 border border-gray-200 rounded-2xl focus:outline-none focus:border-amber-500 transition text-base">
                        <option value="">-- Select Term --</option>
                        {% for t in terms %}<option value="{{ t.name }}">{{ t.name }}</option>{% endfor %}
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Class</label>
                    <select id="class" class="w-full p-4 border border-gray-200 rounded-2xl focus:outline-none focus:border-amber-500 transition text-base">
                        <option value="">-- Select Class --</option>
                        {% for c in classes %}<option value="{{ c.name }}">{{ c.name }}</option>{% endfor %}
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Assessment</label>
                    <select id="assessment" class="w-full p-4 border border-gray-200 rounded-2xl focus:outline-none focus:border-amber-500 transition text-base">
                        <option value="">-- Select Assessment --</option>
                        <option value="CA1">CA 1</option>
                        <option value="CA2">CA 2</option>
                        <option value="Exam">Exam</option>
                    </select>
                </div>
            </div>

            <!-- Student Scores Table -->
            <div id="student-list" class="hidden mb-10">
                <h3 class="font-semibold text-lg mb-4 flex items-center gap-2">
                    Students in <span id="class-name" class="text-amber-600"></span>
                </h3>
                
                <div class="overflow-x-auto rounded-2xl border border-gray-100">
                    <table class="w-full min-w-[600px] table-auto">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="p-4 text-left font-medium text-gray-700">Adm #</th>
                                <th class="p-4 text-left font-medium text-gray-700">Student Name</th>
                                <th class="p-4 text-left font-medium text-gray-700">Subject</th>
                                <th class="p-4 text-left font-medium text-gray-700">Score</th>
                            </tr>
                        </thead>
                        <tbody id="score-rows" class="divide-y"></tbody>
                    </table>
                </div>
            </div>

            <!-- Submit Button -->
            <button id="submit-btn" class="hidden w-full py-5 bg-amber-600 hover:bg-amber-700 text-white font-semibold text-lg rounded-2xl shadow-lg transition transform active:scale-[0.98]">
                Upload All Scores
            </button>

            <!-- Result Message -->
            <div id="result" class="mt-6 text-center"></div>
        </div>
    </div>
</div>

<script>
const subjects = {{ subjects|tojson }};
let students = [];

function buildRows() {
    const rows = document.getElementById('score-rows');
    rows.innerHTML = '';
    const assessment = document.getElementById('assessment').value;
    if (!assessment) return;

    students.forEach(stu => {
        subjects.forEach(sub => {
            const row = document.createElement('tr');
            row.className = "hover:bg-gray-50 transition";
            row.innerHTML = `
                <td class="p-4 border-t">${stu.admission_number}</td>
                <td class="p-4 border-t font-medium">${stu.name}</td>
                <td class="p-4 border-t">${sub.name}</td>
                <td class="p-4 border-t">
                    <input type="number" min="0" max="100"
                           data-adm="${stu.admission_number}"
                           data-sub="${sub.name}"
                           class="w-24 p-3 border border-gray-200 rounded-xl focus:outline-none focus:border-amber-500 text-center">
                </td>
            `;
            rows.appendChild(row);
        });
    });
    document.getElementById('submit-btn').classList.remove('hidden');
}

async function loadStudents() {
    const session = document.getElementById('session').value;
    const term = document.getElementById('term').value;
    const cls = document.getElementById('class').value;
    const assessment = document.getElementById('assessment').value;

    if (!session || !term || !cls || !assessment) return;

    const res = await fetch(`/teacher/api/students?class=${cls}`);
    students = await res.json();

    document.getElementById('class-name').textContent = cls;
    document.getElementById('student-list').classList.remove('hidden');
    buildRows();
}

// Event Listeners
['session','term','class','assessment'].forEach(id => {
    document.getElementById(id).addEventListener('change', loadStudents);
});

document.getElementById('submit-btn').addEventListener('click', async () => {
    const scores = [];
    document.querySelectorAll('#score-rows input').forEach(inp => {
        if (inp.value) {
            scores.push({
                adm_no: inp.dataset.adm,
                subject: inp.dataset.sub,
                score: parseInt(inp.value)
            });
        }
    });

    const payload = {
        session: document.getElementById('session').value,
        term: document.getElementById('term').value,
        class: document.getElementById('class').value,
        assessment: document.getElementById('assessment').value,
        scores
    };

    const res = await fetch('/teacher/upload', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(payload)
    });

    const data = await res.json();
    const resultDiv = document.getElementById('result');
    
    if (data.status === 'success') {
        resultDiv.innerHTML = `<p class="text-green-600 font-medium py-4">✅ Results uploaded successfully!</p>`;
    } else {
        resultDiv.innerHTML = `<p class="text-red-600 font-medium py-4">${data.error || 'Upload failed'}</p>`;
    }
});
</script>

{% endblock %}
