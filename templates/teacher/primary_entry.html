{% extends "base.html" %}
{% block content %}
<div class="max-w-7xl mx-auto mt-8 px-4 flex gap-8">

    <!-- Sidebar -->
    <div class="w-80 bg-white rounded-3xl shadow-xl p-6 h-fit sticky top-8">
        <h3 class="text-xl font-bold mb-6 text-gray-800">{{ class_name }} Students</h3>
        <div class="space-y-2 max-h-[75vh] overflow-y-auto" id="student-list">
            {% for student in students %}
                <button onclick="loadStudent('{{ student.admission_number }}', '{{ student.name }}')"
                        class="student-btn w-full text-left px-5 py-4 rounded-2xl hover:bg-indigo-50 transition flex justify-between items-center"
                        data-adm-no="{{ student.admission_number }}">
                    <span>{{ student.name }}</span>
                    <span class="text-xs text-gray-500">{{ student.admission_number }}</span>
                </button>
            {% endfor %}
        </div>
    </div>

    <!-- Main Content -->
    <div class="flex-1 bg-white rounded-3xl shadow-xl p-10">
        <div class="flex justify-between items-center mb-10">
            <div>
                <h2 class="text-3xl font-bold text-gray-800" id="current-student-name">Select a Student</h2>
                <p class="text-gray-600" id="current-adm-no"></p>
            </div>
            <div class="flex gap-4">
                <a href="{{ url_for('teacher.teacher_broadsheet', class_name=class_name) }}" 
                   class="px-6 py-3 bg-indigo-600 hover:bg-indigo-700 text-white rounded-2xl transition">
                    📊 Broadsheet
                </a>
                <button onclick="saveAndNext()" 
                        class="px-10 py-4 bg-green-700 hover:bg-green-600 text-white font-bold rounded-2xl shadow-lg transition">
                    Save & Next →
                </button>
            </div>
        </div>

        <!-- Subject Selection -->
        <div class="mb-10 p-6 bg-gray-50 rounded-2xl border">
            <h3 class="font-semibold text-gray-700 mb-4">Select Subjects for This Class</h3>
            <div class="grid grid-cols-2 md:grid-cols-3 gap-3" id="subject-selector"></div>
        </div>

        <!-- Score Form -->
        <form id="score-form">
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-8" id="subjects-container"></div>
        </form>

        <!-- Psychomotor -->
        <div class="mt-12 border-t pt-10">
            <h3 class="font-semibold text-gray-700 mb-6">Psychomotor Ratings</h3>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-6" id="psychomotor-container"></div>
        </div>
    </div>
</div>

<script>
    let currentStudentAdmNo = null;
    
    // Safe defaults
    let selectedSubjects = {{ selected_subjects | tojson | default('[]') }};
    let allPossibleSubjects = {{ subjects | tojson | default('[]') }};

    const psychomotorSkills = ["Punctuality", "Neatness", "Honesty", "Leadership", "Politeness", "Teamwork", "Initiative", "Reliability"];

    function renderSubjectSelector() {
        const container = document.getElementById('subject-selector');
        container.innerHTML = '';

        allPossibleSubjects.forEach(subject => {
            const checked = selectedSubjects.includes(subject);
            const div = document.createElement('div');
            div.innerHTML = `
                <label class="flex items-center gap-3 bg-white p-4 rounded-2xl border cursor-pointer hover:border-indigo-300">
                    <input type="checkbox" ${checked ? 'checked' : ''} 
                           onchange="toggleSubject('${subject}', this.checked)" class="w-5 h-5">
                    <span class="font-medium">${subject}</span>
                </label>
            `;
            container.appendChild(div);
        });
    }

    function toggleSubject(subject, checked) {
        if (checked) {
            if (!selectedSubjects.includes(subject)) selectedSubjects.push(subject);
        } else {
            selectedSubjects = selectedSubjects.filter(s => s !== subject);
        }
        renderSubjectForm();
    }

    function renderSubjectForm() {
        const container = document.getElementById('subjects-container');
        container.innerHTML = '';

        selectedSubjects.forEach(subject => {
            const div = document.createElement('div');
            div.className = "border border-gray-200 rounded-2xl p-6";
            div.innerHTML = `
                <h4 class="font-semibold text-gray-700 mb-5">${subject}</h4>
                <div class="grid grid-cols-3 gap-6">
                    <div><label class="text-xs text-gray-500">CA1</label>
                        <input type="number" name="ca1_${subject}" min="0" max="15" class="w-full mt-1 border rounded-xl px-4 py-3 text-center">
                    </div>
                    <div><label class="text-xs text-gray-500">CA2</label>
                        <input type="number" name="ca2_${subject}" min="0" max="15" class="w-full mt-1 border rounded-xl px-4 py-3 text-center">
                    </div>
                    <div><label class="text-xs text-gray-500">Exam</label>
                        <input type="number" name="exam_${subject}" min="0" max="70" class="w-full mt-1 border rounded-xl px-4 py-3 text-center">
                    </div>
                </div>
            `;
            container.appendChild(div);
        });
    }

    // Load first student
    window.onload = () => {
        renderSubjectSelector();
        const firstBtn = document.querySelector('.student-btn');
        if (firstBtn) {
            loadStudent(firstBtn.dataset.admNo, firstBtn.textContent.trim().split('\n')[0]);
        }
    };
</script>
{% endblock %}
