{% extends 'base.html' %}
{% block content %}
<section class="max-w-lg mx-auto p-6">
    <h2 class="text-3xl font-bold text-indigo-700 mb-8">Create New Session</h2>
    <form method="POST" class="space-y-6">
        <div>
            <label class="block text-lg font-medium mb-2">Session Name (e.g., 2026/2027)</label>
            <input type="text" name="name" required class="w-full px-4 py-3 border rounded-lg" placeholder="2026/2027">
        </div>
        <button type="submit" class="w-full py-3 bg-indigo-600 text-white font-bold rounded-lg hover:bg-indigo-700">
            Create Session
        </button>
    </form>
</section>
{% endblock %}
