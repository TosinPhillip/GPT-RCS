{% extends "base.html" %}
{% block content %}
<div class="max-w-4xl mx-auto mt-12 px-4">
    <div class="bg-white rounded-2xl shadow-2xl p-10">
        <h2 class="text-3xl font-bold text-indigo-700 mb-8 text-center">Generate Broadsheet</h2>

        <form method="POST" class="space-y-8 max-w-lg mx-auto">
            <div>
                <label class="block text-lg font-medium text-gray-700 mb-3">Class</label>
                <select name="class" required class="w-full px-6 py-4 border border-gray-300 rounded-xl focus:ring-4 focus:ring-indigo-300">
                    <option value="">Select Class</option>
                    {% for c in classes %}
                        <option value="{{ c }}">{{ c }}</option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label class="block text-lg font-medium text-gray-700 mb-3">Term</label>
                <select name="term" required class="w-full px-6 py-4 border border-gray-300 rounded-xl focus:ring-4 focus:ring-indigo-300">
                    {% for t in terms %}
                        <option value="{{ t }}">{{ t }} Term</option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label class="block text-lg font-medium text-gray-700 mb-3">Assessment Type</label>
                <select name="assessment" required class="w-full px-6 py-4 border border-gray-300 rounded-xl focus:ring-4 focus:ring-indigo-300">
                    {% for value, label in assessments %}
                        <option value="{{ value }}">{{ label }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="text-center">
                <button type="submit" class="px-12 py-5 bg-indigo-700 hover:bg-indigo-600 text-white text-xl font-bold rounded-xl shadow-lg transition">
                    Generate Broadsheet
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
