{% extends "base.html" %}
{% block content %}
<div class="max-w-4xl mx-auto mt-12 px-4">
    <div class="bg-white rounded-3xl shadow-2xl p-10">
        <h2 class="text-4xl font-bold text-indigo-700 mb-10 text-center heading-font">Generate Broadsheet</h2>
        
        <form method="POST" class="space-y-10 max-w-lg mx-auto">
            <div>
                <label class="block text-lg font-medium text-gray-700 mb-3">Class</label>
                <select name="class" required 
                        class="w-full px-6 py-5 border border-gray-300 rounded-2xl focus:border-indigo-500 focus:ring-4 focus:ring-indigo-100 transition text-lg">
                    <option value="">Select Class</option>
                    {% for c in classes %}
                        <option value="{{ c }}">{{ c }}</option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label class="block text-lg font-medium text-gray-700 mb-3">Term</label>
                <select name="term" required 
                        class="w-full px-6 py-5 border border-gray-300 rounded-2xl focus:border-indigo-500 focus:ring-4 focus:ring-indigo-100 transition text-lg">
                    {% for t in terms %}
                        <option value="{{ t }}">{{ t }} Term</option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label class="block text-lg font-medium text-gray-700 mb-3">Assessment Type</label>
                <select name="assessment" required 
                        class="w-full px-6 py-5 border border-gray-300 rounded-2xl focus:border-indigo-500 focus:ring-4 focus:ring-indigo-100 transition text-lg">
                    <option value="ca1">CA1</option>
                    <option value="ca2">CA2</option>
                    <option value="exam">Exam</option>
                    <option value="total">Total Score</option>
                    <option value="cumulative">Cumulative Average (All Terms)</option>
                </select>
            </div>

            <div class="text-center pt-6">
                <button type="submit" 
                        class="w-full sm:w-auto px-16 py-6 bg-indigo-700 hover:bg-indigo-600 text-white text-xl font-semibold rounded-3xl shadow-lg transition transform active:scale-95">
                    Generate Broadsheet
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
