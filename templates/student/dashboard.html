{% extends "base.html" %}
{% block content %}
<div class="max-w-6xl mx-auto px-4 sm:px-6 py-8">
    <div class="bg-white rounded-3xl shadow-2xl overflow-hidden">
        <!-- Header -->
        <div class="bg-gradient-to-br from-amber-600 to-yellow-600 text-white p-10 text-center">
            <h1 class="text-4xl font-bold heading-font">Welcome, {{ student_name }}</h1>
            <p class="text-amber-100 mt-2 text-lg">God's Peculiar Treasure School • Result Portal</p>
        </div>

        <div class="p-8 sm:p-12">
            <!-- Session & Term Selector -->
            <div class="flex flex-wrap gap-4 mb-10">
                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-2">Session</label>
                    <select id="session-select" class="border border-gray-300 rounded-2xl px-5 py-3 focus:border-amber-500">
                        {% for s in sessions %}
                        <option value="{{ s }}" {% if s == selected_session %}selected{% endif %}>{{ s }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-2">Term</label>
                    <select id="term-select" class="border border-gray-300 rounded-2xl px-5 py-3 focus:border-amber-500">
                        {% for t in terms %}
                        <option value="{{ t }}">{{ t }} Term</option>
                        {% endfor %}
                    </select>
                </div>
                <button onclick="loadResults()" 
                        class="self-end px-8 py-3 bg-amber-600 hover:bg-amber-700 text-white rounded-2xl font-semibold">
                    Load Results
                </button>
            </div>

            <!-- Results Display -->
            <div id="results-container" class="space-y-8"></div>

            <!-- Printable Report Card -->
            <div id="report-card" class="mt-16 hidden print:block">
                <!-- Report Card Content will be injected here by JS or rendered server-side -->
                <div class="border-2 border-amber-800 rounded-3xl p-10 bg-white">
                    <!-- You can also render this server-side if preferred -->
                    <h2 class="text-center text-3xl font-bold mb-8">REPORT CARD</h2>
                    <!-- Full report card HTML from previous message can go here -->
                </div>
            </div>

            <div class="text-center mt-12">
                <button onclick="downloadResultPDF()" 
                        class="px-10 py-5 bg-gradient-to-r from-amber-600 to-yellow-600 text-white font-semibold rounded-3xl text-lg shadow-lg hover:shadow-xl transition">
                    📄 Download Full Report Card (PDF)
                </button>
            </div>
        </div>
    </div>
</div>

<script>
    let currentResults = [];

    async function loadResults() {
        const session = document.getElementById('session-select').value;
        const term = document.getElementById('term-select').value;
        const container = document.getElementById('results-container');

        container.innerHTML = '<p class="text-center py-12 text-gray-500">Loading results...</p>';

        try {
            const res = await fetch(`/student/results?session=${encodeURIComponent(session)}&term=${encodeURIComponent(term)}`);
            const data = await res.json();

            if (data.error) {
                container.innerHTML = `<p class="text-red-600 text-center py-12">${data.error}</p>`;
                return;
            }

            currentResults = data.results[0] || {};
            renderResults(currentResults);
        } catch (err) {
            console.error(err);
            container.innerHTML = `<p class="text-red-600 text-center py-12">Failed to load results. Please try again.</p>`;
        }
    }

    function renderResults(data) {
        const container = document.getElementById('results-container');
        if (!data.subjects || data.subjects.length === 0) {
            container.innerHTML = `<p class="text-center py-12 text-gray-500">No results available yet for this term.</p>`;
            return;
        }

        let html = `
            <div class="bg-white border border-gray-100 rounded-3xl p-8">
                <div class="flex justify-between items-center mb-8">
                    <h2 class="text-3xl font-bold">${data.term || ''} Term Results</h2>
                    <div class="text-right">
                        <p class="text-2xl font-bold text-amber-600">Position: ${data.overall_position || '—'} / ${data.class_size || '—'}</p>
                    </div>
                </div>
                <table class="w-full">
                    <thead>
                        <tr class="border-b border-gray-200">
                            <th class="text-left py-4">Subject</th>
                            <th class="text-center py-4">CA1</th>
                            <th class="text-center py-4">CA2</th>
                            <th class="text-center py-4">Exam</th>
                            <th class="text-center py-4">Total</th>
                            <th class="text-center py-4">Grade</th>
                            <th class="text-center py-4">Position</th>
                        </tr>
                    </thead>
                    <tbody>
        `;

        data.subjects.forEach(sub => {
            html += `
                <tr class="border-b hover:bg-amber-50 transition">
                    <td class="py-5 font-medium">${sub.subject}</td>
                    <td class="text-center">${sub.ca1}</td>
                    <td class="text-center">${sub.ca2}</td>
                    <td class="text-center">${sub.exam}</td>
                    <td class="text-center font-semibold">${sub.total}</td>
                    <td class="text-center font-bold">${sub.grade}</td>
                    <td class="text-center font-medium">${sub.position}</td>
                </tr>
            `;
        });

        html += `</tbody></table>`;

        if (data.teacher_comment) {
            html += `
                <div class="mt-10 border-t pt-8">
                    <h3 class="font-semibold mb-3">Class Teacher's Comment</h3>
                    <p class="italic text-gray-700">${data.teacher_comment}</p>
                </div>
            `;
        }

        html += `</div>`;
        container.innerHTML = html;
    }

    // Download PDF
    async function downloadResultPDF() {
        const feedback = document.createElement('div');
        feedback.className = "fixed bottom-8 right-8 bg-green-600 text-white px-6 py-3 rounded-2xl";
        feedback.textContent = "Generating PDF...";
        document.body.appendChild(feedback);

        try {
            // Simple print for now (best for school report cards)
            window.print();
        } catch (e) {
            alert("Please use the browser's Print → Save as PDF option");
        }

        setTimeout(() => feedback.remove(), 2000);
    }

    // Load default results on page load
    document.addEventListener('DOMContentLoaded', () => {
        loadResults();
    });
</script>

<style>
    @media print {
        body * { visibility: hidden; }
        #report-card, #report-card * { visibility: visible; }
        #report-card { position: absolute; left: 0; top: 0; width: 100%; }
    }
</style>
{% endblock %}
